# Two-step, three-GPU smoke for managed Dynamo prefill/decode disaggregation.
defaults: grpo_math_1B_dynamo.yaml

# Refit in flight: vLLM freezes requests in keep mode instead of draining them, and
# each engine clears its KV and prefix cache while frozen, so the running requests
# recompute on the new weights. The patched vLLM clears a prefill/decode fleet even
# while prefill holds KV for decode.
grpo:
  async_grpo:
    in_flight_weight_updates: true
    recompute_kv_cache_after_weight_updates: true

policy:
  generation:
    dynamo_cfg:
      disaggregation:
        prefill_workers: 1
        decode_workers: 1
        # Seconds a prefill engine holds KV for a decode engine to pull. A refit
        # freezes the decode engines, which send no heartbeat, so the lease must
        # outlast the pause. Setup requires at least twice control_timeout_s.
        kv_lease_duration_s: 1800
    colocated:
      resources:
        gpus_per_node: 2
        num_nodes: 1

logger:
  log_dir: results/grpo-math-1b-dynamo-disagg

cluster:
  gpus_per_node: 3
  num_nodes: 1
