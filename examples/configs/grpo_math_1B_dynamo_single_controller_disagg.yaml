# SingleController variant of the Dynamo prefill/decode smoke: one training GPU, one
# prefill engine, and one decode engine. Every refit freezes both engines in
# vLLM's keep mode without clearing their caches.
defaults: grpo_math_1B_dynamo_single_controller.yaml

policy:
  generation:
    dynamo_cfg:
      disaggregation:
        prefill_workers: 1
        decode_workers: 1
        # Seconds a prefill engine holds KV for a decode engine to pull. The decode
        # engines are frozen during a refit and send no heartbeat, so the lease must
        # outlast it. Setup requires at least twice control_timeout_s, and at least
        # 1.5 times (async_rl.generation_fleet_health.refit_timeout_s + 60).
        kv_lease_duration_s: 1800
    colocated:
      resources:
        gpus_per_node: 2
        num_nodes: 1

logger:
  log_dir: results/grpo-math-1b-dynamo-single-controller-disagg
  wandb:
    name: grpo-dynamo-single-controller-disagg-dev
  swanlab:
    name: grpo-dynamo-single-controller-disagg-dev
  mlflow:
    run_name: grpo-dynamo-single-controller-disagg-dev

cluster:
  gpus_per_node: 3
  num_nodes: 1
